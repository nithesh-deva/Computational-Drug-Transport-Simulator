# M2 Example 4: Mass Conservation Test
# Uniform initial concentration with zero boundary conditions
# Tests mass decay due to clearance

experiment:
  id: M2_MASS_CONSERVATION
  name: M2 Reaction-Diffusion - Mass Conservation with Clearance

drug:
  initial_concentration: 1.0
  unit: mol/m3

tissue:
  layers:
    - name: homogeneous_tissue
      thickness: 0.01
      diffusion_coefficient: 1e-10
      clearance: 0.001

simulation:
  final_time: 1000.0
  spatial_step: 0.0001
  time_step: 10.0

solver:
  method: explicit_fdm

boundary:
  left:
    type: dirichlet
    value: 0.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M2_MASS_CONSERVATION
