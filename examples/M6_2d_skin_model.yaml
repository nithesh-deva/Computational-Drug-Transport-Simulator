# M6 Example 1: 2D Skin Model Geometry
# Rectangular multilayer tissue: Stratum Corneum | Epidermis | Dermis
# Gmsh mesh generation for ParaView visualization

experiment:
  id: M6_2D_SKIN_MODEL
  name: M6 2D Skin Model - Three-Layer Geometry

drug:
  initial_concentration: 0.0
  unit: mol/m3

geometry:
  width: 0.1
  layers:
    - name: stratum_corneum
      thickness: 1.0e-5
      diffusion_coefficient: 0.1e-10
      clearance: 0.0
      mesh_size: 1.0e-4

    - name: epidermis
      thickness: 5.0e-5
      diffusion_coefficient: 1.0e-10
      clearance: 0.001
      mesh_size: 5.0e-4

    - name: dermis
      thickness: 1.0e-4
      diffusion_coefficient: 2.0e-10
      clearance: 0.0005
      mesh_size: 1.0e-3

simulation:
  final_time: 3600.0
  spatial_step: 0.0001
  time_step: 10.0

solver:
  method: fem_2d

boundary:
  left:
    type: dirichlet
    value: 1.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M6_2D_SKIN_MODEL
