# M4 Example 1: Unconditional Stability with Large Time Step
# Demonstrates Crank-Nicolson stability beyond explicit limit (r > 0.5)
# Fourier number r = D*dt/dx^2 = 2.0 (explicit would diverge)

experiment:
  id: M4_IMPLICIT_LARGE_DT
  name: M4 Crank-Nicolson - Unconditional Stability (Large dt)

drug:
  initial_concentration: 0.0
  unit: mol/m3

tissue:
  layers:
    - name: homogeneous_tissue
      thickness: 0.01
      diffusion_coefficient: 1.0e-10
      clearance: 0.0

simulation:
  final_time: 400.0
  spatial_step: 0.0001
  time_step: 200.0

solver:
  method: crank_nicolson

boundary:
  left:
    type: dirichlet
    value: 1.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M4_IMPLICIT_LARGE_DT
