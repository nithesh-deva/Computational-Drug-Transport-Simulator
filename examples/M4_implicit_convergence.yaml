# M4 Example 3: Time-Step Convergence Study
# Demonstrates second-order temporal convergence of Crank-Nicolson
# Compares dt = 50, 25, 12.5 seconds

experiment:
  id: M4_IMPLICIT_CONVERGENCE
  name: M4 Crank-Nicolson - Time-Step Convergence Study

drug:
  initial_concentration: 0.0
  unit: mol/m3

tissue:
  layers:
    - name: homogeneous_tissue
      thickness: 0.01
      diffusion_coefficient: 1.0e-10
      clearance: 0.0

simulation:
  final_time: 200.0
  spatial_step: 0.0001
  time_step: 50.0

solver:
  method: crank_nicolson

boundary:
  left:
    type: dirichlet
    value: 1.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M4_IMPLICIT_CONVERGENCE
