# M5 Example 1: FEM Pure Diffusion
# Basic finite element method with linear Lagrange elements
# Backward Euler time integration

experiment:
  id: M5_FEM_PURE_DIFFUSION
  name: M5 FEM Solver - Pure Diffusion Validation

drug:
  initial_concentration: 0.0
  unit: mol/m3

tissue:
  layers:
    - name: homogeneous_tissue
      thickness: 0.01
      diffusion_coefficient: 1.0e-10
      clearance: 0.0

simulation:
  final_time: 200.0
  spatial_step: 0.0005
  time_step: 50.0
  n_elements: 20

solver:
  method: fem

boundary:
  left:
    type: dirichlet
    value: 1.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M5_FEM_PURE_DIFFUSION
