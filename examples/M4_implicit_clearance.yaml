# M4 Example 2: Reaction-Diffusion with Clearance
# Damköhler number Da = k*L^2/D ~ 1 (intermediate regime)
# Tests clearance handling in implicit scheme

experiment:
  id: M4_IMPLICIT_CLEARANCE
  name: M4 Crank-Nicolson - Reaction-Diffusion with Clearance

drug:
  initial_concentration: 1.0
  unit: mol/m3

tissue:
  layers:
    - name: homogeneous_tissue
      thickness: 0.01
      diffusion_coefficient: 1.0e-10
      clearance: 0.001

simulation:
  final_time: 200.0
  spatial_step: 0.0001
  time_step: 50.0

solver:
  method: crank_nicolson

boundary:
  left:
    type: dirichlet
    value: 0.0

  right:
    type: dirichlet
    value: 0.0

output:
  directory: results/M4_IMPLICIT_CLEARANCE
